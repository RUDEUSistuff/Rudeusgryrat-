<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UltimateAi Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;padding:20px;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(ellipse at center,#0a0f2a 0%,#03050b 100%);color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center;flex-direction:column;overflow-x:hidden}
.container{max-width:600px;width:90%;background:rgba(10,15,40,0.6);backdrop-filter:blur(10px);border-radius:24px;padding:30px;position:relative}
button,.menu-btn{padding:12px 20px;margin:8px;border:none;border-radius:12px;color:white;background:linear-gradient(135deg,#ff9a9e,#fad0c4);cursor:pointer;transition:all 0.3s ease;font-size:16px;font-weight:600;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
button:hover,.menu-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3);background:linear-gradient(135deg,#ff7a7e,#f8b0a4)}
input,select{padding:12px;width:85%;border-radius:12px;border:1px solid rgba(255,255,255,0.3);text-align:center;margin:10px auto;background:rgba(255,255,255,0.1);color:white;font-size:16px;outline:none;transition:0.2s}
input:focus,select:focus{border-color:#ff9a9e;background:rgba(255,255,255,0.2)}
.hidden{display:none}
.result-box{margin:20px auto;padding:15px;background:rgba(0,0,0,0.3);border-radius:16px;border:1px solid rgba(255,255,255,0.15)}
h1{font-size:28px;background:linear-gradient(135deg,#fff,#ff9a9e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}
h2{font-size:24px;margin-bottom:20px;color:#ff9a9e}
.back-btn{margin-top:20px;background:linear-gradient(135deg,#667eea,#764ba2)}
.back-btn:hover{background:linear-gradient(135deg,#5a67d8,#6b46a1)}
#threeContainer{width:100%;height:300px;margin-top:20px;background:#111;border-radius:16px;overflow:hidden}
</style>
</head>
<body>
<div class="container">
<!-- Welcome -->
<div id="welcome">
<h1>✨ AI Smart Calculator Hub ✨</h1>
<p>Advanced Math & 3D Shapes Demo</p>
<button id="startBtn" class="menu-btn">🚀 Start</button>
</div>

<!-- Menu -->
<div id="menu" class="hidden">
<h2>📱 Select Mode</h2>
<button class="menu-btn" onclick="showPage('math')">🧮 Math</button>
<button class="menu-btn" onclick="showPage('physics')">⚡ Physics (Demo)</button>
<button class="menu-btn" onclick="showPage('puzzle')">🎮 Puzzle (Demo)</button>
<button class="menu-btn" onclick="showPage('ai3d')">🎨 3D Shapes</button>
<button class="back-btn" onclick="resetToWelcome()">🏠 Home</button>
</div>

<!-- Math -->
<div id="math" class="hidden">
<h2>🧮 Math Calculator</h2>
<input id="mathInput" placeholder="Enter operation...">
<div>
<button onclick="clearMath()">🗑 Clear</button>
<button onclick="calculateMath()">= Calculate</button>
</div>
<div class="result-box">
<div class="result" id="mathRes">📊 Result: ---</div>
<div class="result" id="mathExplain">📝 Explanation: ---</div>
</div>
<button class="back-btn" onclick="showPage('menu')">🔙 Back to Menu</button>
</div>

<!-- Physics -->
<div id="physics" class="hidden">
<h2>⚡ Physics Laws (Demo)</h2>
<p>All physics laws give Demo result</p>
<button class="back-btn" onclick="showPage('menu')">🔙 Back to Menu</button>
</div>

<!-- Puzzle -->
<div id="puzzle" class="hidden">
<h2>🎮 Puzzle Game (Demo)</h2>
<p>All answers will show Demo</p>
<button class="back-btn" onclick="showPage('menu')">🔙 Back to Menu</button>
</div>

<!-- 3D Shapes -->
<div id="ai3d" class="hidden">
<h2>🎨 3D Shapes Calculator</h2>
<select id="shapeSelect3D">
<option value="cube">📦 Cube</option>
<option value="sphere">⚽ Sphere</option>
<option value="cone">📐 Cone</option>
<option value="pyramid">🔺 Pyramid</option>
</select>
<input id="aiDimension" type="number" placeholder="Enter size/radius/height" step="any">
<select id="calcType">
<option value="volume">📊 Volume</option>
<option value="surface">📐 Surface Area</option>
</select>
<button onclick="solveAI()">🧠 Calculate & Show 3D</button>
<div class="result-box">
<div class="result" id="aiRes">📊 Result: ---</div>
</div>
<div id="threeContainer"></div>
<button class="back-btn" onclick="showPage('menu')">🔙 Back to Menu</button>
</div>
</div>

<script>
// Navigation
function showPage(p){
['menu','math','physics','puzzle','ai3d'].forEach(el=>document.getElementById(el).classList.add('hidden'));
document.getElementById(p).classList.remove('hidden');
}
function resetToWelcome(){
['menu','math','physics','puzzle','ai3d'].forEach(el=>document.getElementById(el).classList.add('hidden'));
document.getElementById('welcome').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=function(){
document.getElementById('welcome').classList.add('hidden');
document.getElementById('menu').classList.remove('hidden');
};

// Math
function clearMath(){document.getElementById('mathInput').value='';document.getElementById('mathRes').innerText='📊 Result: ---';document.getElementById('mathExplain').innerText='📝 Explanation: ---';}
function calculateMath(){
let input=document.getElementById('mathInput').value;
try{
let res=eval(input);
document.getElementById('mathRes').innerText='📊 Result: '+res;
document.getElementById('mathExplain').innerText='📝 '+input+' = '+res;
}catch(e){document.getElementById('mathRes').innerText='❌ Error';document.getElementById('mathExplain').innerText='⚠️ Invalid expression';}
}

// 3D Shapes
let scene, camera, renderer, currentMesh;
function initThree(){
scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,window.innerWidth/600,0.1,1000);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(document.getElementById('threeContainer').clientWidth,300);
document.getElementById('threeContainer').innerHTML='';
document.getElementById('threeContainer').appendChild(renderer.domElement);
camera.position.z=5;
}
function solveAI(){
let shape=document.getElementById('shapeSelect3D').value;
let dim=parseFloat(document.getElementById('aiDimension').value);
let type=document.getElementById('calcType').value;
if(isNaN(dim)){alert('Enter valid number');return;}
let result=0;
if(shape==='cube'){result=type==='volume'?Math.pow(dim,3):6*Math.pow(dim,2);}
else if(shape==='sphere'){result=type==='volume'?4/3*Math.PI*Math.pow(dim,3):4*Math.PI*Math.pow(dim,2);}
else if(shape==='cone'){result=type==='volume'?Math.PI*Math.pow(dim,2)*dim:Math.PI*dim*(dim+Math.sqrt(dim*dim+dim*dim));}
else if(shape==='pyramid'){result=type==='volume'?Math.pow(dim,2)*dim/3:Math.pow(dim,2)+2*dim*Math.sqrt((dim/2)*(dim/2)+dim*dim);}
document.getElementById('aiRes').innerText='📊 Result: '+result.toFixed(2);
draw3DShape(shape,dim);
}
function draw3DShape(shape,dim){
if(!scene) initThree();
if(currentMesh) scene.remove(currentMesh);
let geometry;
switch(shape){
case 'cube':geometry=new THREE.BoxGeometry(dim,dim,dim);break;
case 'sphere':geometry=new THREE.SphereGeometry(dim,32,32);break;
case 'cone':geometry=new THREE.ConeGeometry(dim,dim,32);break;
case 'pyramid':geometry=new THREE.ConeGeometry(dim,dim,4);break;
}
let material=new THREE.MeshNormalMaterial();
currentMesh=new THREE.Mesh(geometry,material);
scene.add(currentMesh);
renderer.render(scene,camera);
}
</script>
</body>
</html>
